<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - St. George Serbian Orthodox Church</title>

    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="../css/shared.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kings&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">
    <div class="nav-logo">
        <a href="home.html">
            <img src="../images/Church-Logo-1.png" alt="St. George Church Logo" class="nav-logo-img">
        </a>
    </div>

    <nav class="nav-links">
        <a href="home.html">HOME</a>
        <a href="ourStory.html">OUR STORY</a>
        <a href="newChurch.html">NEW CHURCH</a>
        <a href="events.html">EVENTS</a>
        <a class="active" href="contact.html">CONTACT</a>
    </nav>
</header>

<section id="top" class="contact-hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <span>Visit Us</span>
        <h1>Contact</h1>
    </div>
</section>

<section class="contact-info">
    <div class="contact-heading fade-up">
        <span>Get in Touch</span>
        <h2>Contact Information</h2>
    </div>

    <div class="contact-grid">
        <div class="contact-card fade-up">
            <span class="card-number">01</span>
            <h3>Address</h3>
            <p>
                6108 Braun Rd<br>
                Mount Pleasant<br>
                WI 53403
            </p>
            <a href="https://www.google.com/maps/search/?api=1&query=6108+Braun+Rd+Mount+Pleasant+WI+53403" target="_blank">
                Open in Maps
            </a>
        </div>

        <div class="contact-card fade-up">
            <span class="card-number">02</span>
            <h3>Follow</h3>

            <div class="social-row">
                <a class="social-icon" href="https://www.facebook.com/p/St-George-Serbian-Orthodox-Church-Mt-Pleasant-WI-100090607470461/" target="_blank" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z" />
                    </svg>
                </a>

                <a class="social-icon instagram" href="https://www.instagram.com/st.georgempracine/" target="_blank" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                        <circle cx="12" cy="12" r="4" />
                        <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" />
                    </svg>
                    ◎
                </a>
            </div>
        </div>

        <div class="contact-card fade-up">
            <span class="card-number">03</span>
            <h3>Sunday Service</h3>
            <p>
                Every Sunday<br>
                Divine Liturgy at 10 AM
            </p>
            <a href="events.html">View Events</a>
        </div>
    </div>
</section>

<section class="map-section">
    <div class="map-text fade-up">
        <span>Location</span>
        <h2>Find Us</h2>
    </div>

    <div class="map-wrapper fade-up">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1749.009102692589!2d-87.85479775119155!3d42.68281592555538!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88055d55893c49d3%3A0x7a75d0c28e64bee4!2zU3QgR2VvcmdlIFNlcmJpYW4gT3J0aG9kb3ggQ2h1cmNoIC0g0KHRgNC_0YHQutCwINC_0YDQsNCy0L7RgdC70LDQstC90LAg0YbRgNC60LLQsCDQodCyINCC0L7RgNGS0LA!5e0!3m2!1sen!2sus!4v1777331546572!5m2!1sen!2sus"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen="">
        </iframe>
    </div>
</section>

<a href="#top" class="back-to-top" aria-label="Back to top">↑</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

/* HERO PARALLAX */
gsap.to(".hero-bg", {
    y: 220,
    scale: 1,
    ease: "none",
    scrollTrigger: {
        trigger: ".contact-hero",
        start: "top top",
        end: "bottom top",
        scrub: true
    }
});

gsap.to(".hero-content", {
    y: -110,
    opacity: 0,
    ease: "none",
    scrollTrigger: {
        trigger: ".contact-hero",
        start: "top top",
        end: "bottom top",
        scrub: true
    }
});

/* FADE UP */
gsap.utils.toArray(".fade-up").forEach(el => {
    gsap.from(el, {
        opacity: 0,
        y: 70,
        duration: 1.1,
        ease: "power3.out",
        scrollTrigger: {
            trigger: el,
            start: "top 84%"
        }
    });
});

/* CARD HOVER */
document.querySelectorAll(".contact-card").forEach(card => {
    card.addEventListener("mouseenter", () => {
        gsap.to(card, { y: -8, duration: 0.3, ease: "power2.out" });
    });

    card.addEventListener("mouseleave", () => {
        gsap.to(card, { y: 0, duration: 0.3, ease: "power2.out" });
    });
});

/* BACK TO TOP */
const topBtn = document.querySelector(".back-to-top");

ScrollTrigger.create({
    trigger: ".contact-info",
    start: "top 75%",
    onEnter: () => topBtn.classList.add("visible"),
    onLeaveBack: () => topBtn.classList.remove("visible")
});

topBtn.addEventListener("click", e => {
    e.preventDefault();
    document.querySelector("#top").scrollIntoView({ behavior: "smooth" });
});
</script>

</body>
</html>
